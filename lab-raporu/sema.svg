<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2471a3"/></marker>
  </defs>
  <rect width="960" height="520" fill="#fff"/>
  <text x="480" y="26" text-anchor="middle" font-size="17" font-weight="bold">İç İçe Borulu Isı Değiştiricisi Deney Düzeneği (Şematik)</text>

  <!-- HAVA HATTI -->
  <rect x="20" y="160" width="70" height="50" fill="#eee" stroke="#333"/>
  <text x="55" y="182" text-anchor="middle">FAN</text><text x="55" y="198" text-anchor="middle" font-size="11">(1)</text>
  <line x1="90" y1="185" x2="120" y2="185" stroke="#c0392b" stroke-width="3" marker-end="url(#r)"/>
  <!-- hava venturisi -->
  <path d="M120,170 L160,170 L185,178 L210,170 L240,170 L240,200 L210,200 L185,192 L160,200 L120,200 z" fill="#fdebd0" stroke="#333"/>
  <text x="180" y="222" text-anchor="middle">Hava venturisi (2)</text>
  <line x1="140" y1="170" x2="140" y2="110" stroke="#333"/><line x1="185" y1="178" x2="185" y2="110" stroke="#333"/>
  <rect x="120" y="80" width="90" height="30" fill="#d6eaf8" stroke="#333"/>
  <text x="165" y="99" text-anchor="middle" font-size="11">Δp sensörü (3)</text>
  <line x1="240" y1="185" x2="270" y2="185" stroke="#c0392b" stroke-width="3" marker-end="url(#r)"/>
  <!-- ısıtıcı -->
  <rect x="270" y="165" width="80" height="40" fill="#f5b7b1" stroke="#333"/>
  <path d="M280,185 l8,-10 l8,20 l8,-20 l8,20 l8,-20 l8,20 l8,-10" fill="none" stroke="#922b21"/>
  <text x="310" y="155" text-anchor="middle">Isıtıcı (4)</text>
  <line x1="350" y1="185" x2="400" y2="185" stroke="#c0392b" stroke-width="3"/>

  <!-- ISI DEĞİŞTİRİCİ -->
  <rect x="400" y="150" width="380" height="70" fill="#d4e6f1" stroke="#333" stroke-width="2"/>
  <rect x="380" y="175" width="420" height="20" fill="#fadbd8" stroke="#333"/>
  <text x="590" y="140" text-anchor="middle" font-weight="bold">Isı değiştiricisi (5): iç boru = sıcak hava, kovan = su</text>
  <line x1="420" y1="185" x2="760" y2="185" stroke="#c0392b" stroke-width="2" marker-end="url(#r)"/>
  <text x="590" y="189" text-anchor="middle" font-size="11" fill="#922b21">HAVA →</text>
  <line x1="760" y1="163" x2="420" y2="163" stroke="#2471a3" stroke-width="2" marker-end="url(#b)"/>
  <line x1="760" y1="208" x2="420" y2="208" stroke="#2471a3" stroke-width="2" marker-end="url(#b)"/>
  <text x="590" y="160" text-anchor="middle" font-size="11" fill="#1a5276">← SU (ters akış)</text>
  <line x1="800" y1="185" x2="880" y2="185" stroke="#c0392b" stroke-width="3" marker-end="url(#r)"/>
  <text x="900" y="189" font-size="12">Atmosfer</text>

  <!-- termokupllar -->
  <g font-size="11">
    <circle cx="372" cy="185" r="7" fill="#f9e79f" stroke="#333"/><line x1="372" y1="192" x2="372" y2="228" stroke="#333" stroke-dasharray="3"/><text x="368" y="240" text-anchor="end">T1: T_hava,giriş</text>
    <circle cx="820" cy="185" r="7" fill="#f9e79f" stroke="#333"/><line x1="820" y1="192" x2="820" y2="228" stroke="#333" stroke-dasharray="3"/><text x="824" y="240">T2: T_hava,çıkış</text>
  </g>
  <!-- su bağlantıları -->
  <line x1="760" y1="400" x2="760" y2="226" stroke="#2471a3" stroke-width="3" marker-end="url(#b)"/>
  <line x1="420" y1="220" x2="420" y2="290" stroke="#2471a3" stroke-width="3"/>
  <line x1="420" y1="290" x2="105" y2="290" stroke="#2471a3" stroke-width="3"/>
  <line x1="105" y1="290" x2="105" y2="364" stroke="#2471a3" stroke-width="3" marker-end="url(#b)"/>
  <circle cx="760" cy="260" r="7" fill="#f9e79f" stroke="#333"/><text x="750" y="264" font-size="11" text-anchor="end">T3: T_su,giriş</text>
  <circle cx="420" cy="260" r="7" fill="#f9e79f" stroke="#333"/><text x="432" y="264" font-size="11">T4: T_su,çıkış</text>
  <text x="260" y="284" font-size="11" fill="#1a5276">Isınan su depoya döner</text>
  <rect x="60" y="370" width="90" height="60" fill="#d6eaf8" stroke="#333"/>
  <text x="105" y="398" text-anchor="middle">Su deposu</text><text x="105" y="414" text-anchor="middle" font-size="11">(6)</text>
  <line x1="150" y1="400" x2="215" y2="400" stroke="#2471a3" stroke-width="3"/>
  <circle cx="240" cy="400" r="25" fill="#eee" stroke="#333"/><text x="240" y="404" text-anchor="middle">Pompa</text><text x="240" y="440" text-anchor="middle" font-size="11">(7)</text>
  <line x1="265" y1="400" x2="530" y2="400" stroke="#2471a3" stroke-width="3" marker-end="url(#b)"/>
  <path d="M530,385 L560,385 L585,393 L610,385 L640,385 L640,415 L610,415 L585,407 L560,415 L530,415 z" fill="#d6eaf8" stroke="#333"/>
  <text x="585" y="372" text-anchor="middle" font-size="11">Su venturisi (8): D_A=26, D_B=16 mm</text>
  <line x1="545" y1="415" x2="545" y2="460" stroke="#333"/><line x1="585" y1="407" x2="585" y2="460" stroke="#333"/>
  <path d="M535,460 L535,495 L595,495 L595,460" fill="none" stroke="#333" stroke-width="2"/>
  <text x="610" y="485" font-size="11">U-manometre (9) → Δp_su [mmSS]</text>
  <line x1="640" y1="400" x2="760" y2="400" stroke="#2471a3" stroke-width="3"/>
  <text x="22" y="512" font-size="11" fill="#555">T1–T4: ısıl çiftler (termokupl) → dijital sıcaklık göstergesi. Kırmızı: hava hattı, mavi: su hattı.</text>
</svg>
