<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <title>126'dan 105'e</title>
  <meta name="description" content="Diyet ve antrenman takibi — telefon ve bilgisayar arasında senkron." />

  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0f1310" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f3f4ef" media="(prefers-color-scheme: light)" />

  <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Diyet" />

  <link rel="stylesheet" href="./app.css" />
</head>
<body>

  <div id="screen-loading" class="centered">
    <div class="stack center">
      <div class="spinner"></div>
      <p class="muted" id="loading-text">Yükleniyor…</p>
    </div>
  </div>

  <div id="screen-auth" class="centered hidden"></div>

  <div id="screen-app" class="hidden">
    <header class="topbar">
      <button class="icon-btn" data-act="prev-day" aria-label="önceki gün">‹</button>
      <div class="day-box">
        <div id="day-label">Bugün</div>
        <div id="day-sub" class="sub"></div>
      </div>
      <button class="icon-btn" data-act="next-day" aria-label="sonraki gün">›</button>
      <button class="chip" id="go-today" data-act="go-today" hidden>bugüne dön</button>
      <span class="grow"></span>
      <span class="sync" id="sync"></span>
      <button class="icon-btn" data-act="menu" aria-label="ayarlar">⚙</button>
    </header>

    <main id="view"></main>

    <nav class="navbar">
      <button data-view="diyet" aria-selected="true"><span class="ico">🥗</span><span>Diyet</span></button>
      <button data-view="spor"  aria-selected="false"><span class="ico">🏋️</span><span>Spor</span></button>
    </nav>
  </div>

  <div id="modal-root"></div>

  <noscript>
    <div class="centered"><div class="auth center">
      <h1>126'dan 105'e</h1>
      <p class="muted">Bu uygulamanın çalışması için JavaScript gerekir.</p>
    </div></div>
  </noscript>

  <script type="module" src="./app.js"></script>
</body>
</html>
