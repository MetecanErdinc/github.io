<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 510" width="880" height="510" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="jet" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L7.5,3 L0,6 z" fill="#2a78d6"/>
    </marker>
    <marker id="suck" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L7.5,3 L0,6 z" fill="#52514e"/>
    </marker>
    <marker id="rec" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L7.5,3 L0,6 z" fill="#eb6834"/>
    </marker>
    <pattern id="dead" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#b9b8b2" stroke-width="1.6"/>
    </pattern>
  </defs>

  <rect width="880" height="510" fill="#fcfcfb"/>

  <!-- kavite -->
  <rect x="58" y="46" width="560" height="322" fill="#ffffff" stroke="#52514e" stroke-width="2"/>
  <!-- yalitimli govde -->
  <rect x="44" y="32" width="588" height="350" fill="none" stroke="#c9c8c2" stroke-width="9"/>

  <!-- rezistanslar -->
  <path d="M96,66 l16,-9 l16,18 l16,-18 l16,18 l16,-18 l16,18 l16,-18 l16,18 l16,-18 l16,18 l16,-18 l16,18 l16,-9"
        fill="none" stroke="#eb6834" stroke-width="2.6"/>
  <path d="M96,350 l16,-9 l16,18 l16,-18 l16,18 l16,-18 l16,18 l16,-18 l16,18 l16,-18 l16,18 l16,-18 l16,18 l16,-9"
        fill="none" stroke="#eb6834" stroke-width="2.6"/>

  <!-- olu hacimler -->
  <path d="M60,48 h74 a74,74 0 0 1 -74,74 z" fill="url(#dead)" stroke="none"/>
  <path d="M60,366 h74 a74,74 0 0 0 -74,-74 z" fill="url(#dead)" stroke="none"/>

  <!-- tepsiler -->
  <rect x="104" y="152" width="404" height="9" rx="2" fill="#52514e"/>
  <rect x="104" y="258" width="404" height="9" rx="2" fill="#52514e"/>
  <!-- raf destekleri -->
  <line x1="72" y1="156" x2="104" y2="156" stroke="#a9a8a2" stroke-width="2"/>
  <line x1="600" y1="392" x2="619" y2="372" stroke="#a9a8a2" stroke-width="1.4"/>
  <line x1="72" y1="262" x2="104" y2="262" stroke="#a9a8a2" stroke-width="2"/>

  <!-- FKS: delikli plaka -->
  <rect x="612" y="46" width="14" height="322" fill="#e7e6e1" stroke="#52514e" stroke-width="1.6"/>
  <g fill="#fcfcfb" stroke="#52514e" stroke-width="1">
    <rect x="614" y="86"  width="10" height="15" rx="2"/>
    <rect x="614" y="130" width="10" height="15" rx="2"/>
    <rect x="614" y="174" width="10" height="15" rx="2"/>
    <rect x="614" y="262" width="10" height="15" rx="2"/>
    <rect x="614" y="306" width="10" height="15" rx="2"/>
  </g>
  <!-- emme agzi (merkez) -->
  <circle cx="619" cy="222" r="21" fill="#fcfcfb" stroke="#52514e" stroke-width="1.6"/>

  <!-- fan -->
  <circle cx="700" cy="207" r="56" fill="none" stroke="#52514e" stroke-width="2"/>
  <g stroke="#2a78d6" stroke-width="3.4" fill="none" stroke-linecap="round">
    <path d="M700,207 L742,178"/><path d="M700,207 L742,236"/>
    <path d="M700,207 L700,151"/><path d="M700,207 L700,263"/>
    <path d="M700,207 L658,178"/><path d="M700,207 L658,236"/>
  </g>
  <circle cx="700" cy="207" r="9" fill="#52514e"/>
  <path d="M700,133 a74,74 0 0 1 52,22" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#jet)"/>

  <!-- hava kanallari -->
  <path d="M700,151 C700,86 690,62 634,62" fill="none" stroke="#a9a8a2" stroke-width="11" stroke-linecap="round"/>
  <path d="M700,263 C700,330 690,352 634,352" fill="none" stroke="#a9a8a2" stroke-width="11" stroke-linecap="round"/>

  <!-- jetler -->
  <g stroke="#2a78d6" stroke-width="2.4" fill="none" marker-end="url(#jet)">
    <line x1="608" y1="93"  x2="512" y2="106"/>
    <line x1="608" y1="137" x2="500" y2="140"/>
    <line x1="608" y1="181" x2="516" y2="196"/>
    <line x1="608" y1="269" x2="516" y2="252"/>
    <line x1="608" y1="313" x2="512" y2="300"/>
  </g>
  <!-- emme oku -->
  <line x1="470" y1="222" x2="592" y2="222" stroke="#52514e" stroke-width="2.4"
        stroke-dasharray="7 5" marker-end="url(#suck)" fill="none"/>

  <!-- geri sirkulasyon -->
  <path d="M150,196 a30,26 0 1 0 46,14" fill="none" stroke="#eb6834" stroke-width="2.4" marker-end="url(#rec)"/>
  <path d="M150,296 a30,26 0 1 1 46,-14" fill="none" stroke="#eb6834" stroke-width="2.4" marker-end="url(#rec)"/>

  <!-- numarali cagrilar -->
  <g font-size="13" font-weight="bold" fill="#ffffff">
    <circle cx="700" cy="290" r="13" fill="#2a78d6"/><text x="700" y="295" text-anchor="middle">1</text>
    <circle cx="655" cy="46"  r="13" fill="#2a78d6"/><text x="655" y="51"  text-anchor="middle">2</text>
    <circle cx="586" cy="404" r="13" fill="#2a78d6"/><text x="586" y="409" text-anchor="middle">3</text>
    <circle cx="540" cy="222" r="13" fill="#52514e"/><text x="540" y="227" text-anchor="middle">4</text>
    <circle cx="86"  cy="86"  r="13" fill="#8d8c86"/><text x="86"  y="91"  text-anchor="middle">5</text>
    <circle cx="176" cy="246" r="13" fill="#eb6834"/><text x="176" y="251" text-anchor="middle">6</text>
    <circle cx="306" cy="140" r="13" fill="#52514e"/><text x="306" y="145" text-anchor="middle">7</text>
    <circle cx="306" cy="66"  r="13" fill="#eb6834"/><text x="306" y="71"  text-anchor="middle">8</text>
  </g>

  <!-- aciklama listesi -->
  <g font-size="12.5" fill="#52514e">
    <text x="44"  y="440">1  Sirkülasyon fanı</text>
    <text x="44"  y="462">2  Hava kanalı</text>
    <text x="44"  y="484">3  Fan koruma sacı (FKS)</text>
    <text x="300" y="440">4  Emme ağzı (kaviteden fana dönüş)</text>
    <text x="300" y="462">5  Ölü hacim (jetlerin ulaşmadığı köşe)</text>
    <text x="300" y="484">6  Geri sirkülasyon bölgesi</text>
    <text x="620" y="440">7  Tepsi ve raf</text>
    <text x="620" y="462">8  Rezistans (ışınım kaynağı)</text>
    <text x="620" y="484">Mavi ok: FKS jetleri</text>
  </g>
</svg>
